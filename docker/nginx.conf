server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Revalidate the shell, manifest and icons after a deployment.
    add_header Cache-Control "no-cache" always;

    location /api/ {
        # URLs contain read capabilities; do not record them in access logs.
        access_log off;
        error_log /dev/null;
        client_max_body_size 10m;
        resolver 127.0.0.11 valid=10s;
        set $subscription_upstream http://subscriptions:3001;
        proxy_pass $subscription_upstream;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Vite fingerprints these filenames; missing assets must remain a 404.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
