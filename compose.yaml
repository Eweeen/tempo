services:
  tempo:
    image: tempo-calendar:local
    build:
      context: .
    ports:
      - "${TEMPO_BIND_ADDRESS:-127.0.0.1}:${TEMPO_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    depends_on:
      subscriptions:
        condition: service_healthy
  subscriptions:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    read_only: true
    volumes:
      - subscriptions:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  subscriptions:
